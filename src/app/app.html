<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" routerLink="/">
      <img class="logo" src="favicon.svg" alt="" width="40" height="40" />
      <span class="brand-text">
        <strong>{{ 'app.title' | t }}</strong>
        <small>{{ 'app.tagline' | t }}</small>
      </span>
    </a>
    <button type="button" class="btn btn-ghost" (click)="i18n.toggle()">
      {{ 'app.switchLanguage' | t }}
    </button>
  </div>

  @if (nav.length) {
    <nav class="container tabs">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path || '/'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '' }"
        >
          {{ item.label | t }}
        </a>
      }
    </nav>
  }
</header>

<main class="container content">
  <router-outlet />
</main>

<footer class="container footer">
  <p>{{ 'footer.source' | t }}</p>
  <p>{{ 'footer.disclaimer' | t }}</p>
</footer>
