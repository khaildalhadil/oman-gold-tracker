[build]
  command = "npm run build"
  publish = "dist/oman-gold-tracker/browser"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: let Angular's router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build output file names are content-hashed, so they can be cached forever.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
